<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>刷B站</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="hero">
      <div class="logo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5 19 12l-10 5.5z" fill="currentColor" /></svg>
      </div>
      <div class="hero-text">
        <h1>刷B站</h1>
        <p>把 B 站刷成竖屏短视频</p>
      </div>
    </header>

    <main>
      <button id="toggle" class="primary">
        <span class="dot"></span>
        <span id="toggle-label">打开竖滑视频流</span>
      </button>
      <p id="hint" class="hint">在 bilibili.com 页面使用；也可以用 <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>B</kbd></p>

      <!-- 互动：作用于「正在播放的视频」，没有视频流时作用于当前视频页 -->
      <section class="actions" id="actions" hidden>
        <div class="actions-head">
          <img id="act-cover" alt="" />
          <div class="actions-meta">
            <div id="act-title" class="actions-title">—</div>
            <div id="act-up" class="actions-up">—</div>
          </div>
        </div>
        <div class="act-grid">
          <button class="act" data-act="like" title="点赞">
            <b>赞</b><span data-num="like">—</span>
          </button>
          <button class="act" data-act="coin" title="投 2 个币">
            <b>币</b><span data-num="coin">—</span>
          </button>
          <button class="act" data-act="fav" title="收藏到默认收藏夹">
            <b>藏</b><span data-num="fav">—</span>
          </button>
          <button class="act" data-act="comment" title="打开评论">
            <b>评</b><span data-num="comment">—</span>
          </button>
        </div>
      </section>

      <section class="settings">
        <label class="row">
          <span>入口位置</span>
          <select id="entryMode">
            <option value="native">嵌进 B 站顶栏</option>
            <option value="floating">右下角悬浮按钮</option>
            <option value="hidden">只留快捷键</option>
          </select>
        </label>
        <label class="row">
          <span>进视频页自动开刷</span>
          <input type="checkbox" id="openOnVideoPage" />
        </label>
        <label class="row">
          <span>打开时隐藏原页面</span>
          <input type="checkbox" id="hideRelated" />
        </label>
        <label class="row">
          <span>静音启动</span>
          <input type="checkbox" id="muteOnStart" />
        </label>
        <label class="row">
          <span>显示弹幕</span>
          <input type="checkbox" id="danmaku" />
        </label>
        <label class="row">
          <span>自动连播</span>
          <input type="checkbox" id="autoplay" />
        </label>
        <label class="row">
          <span>默认来源</span>
          <select id="source">
            <option value="recommend">推荐</option>
            <option value="popular">热门</option>
            <option value="ranking">排行榜</option>
            <option value="follow">关注</option>
          </select>
        </label>
      </section>
    </main>

    <footer>
      <span id="status">正在检查当前标签页…</span>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
